# energy.mgmt0.net (clone energygraph) - drop-in systemd de grafana-server
[Service]
Environment=GF_SERVER_ROOT_URL=https://energy.mgmt0.net/
Environment=GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=hokkos-deckgl-grafana
# Lecture anonyme : les visiteurs sont Viewer de l'organisation principale.
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment="GF_AUTH_ANONYMOUS_ORG_NAME=Main Org."
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
Environment=GF_AUTH_ANONYMOUS_HIDE_VERSION=true
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_USERS_ALLOW_ORG_CREATE=false
Environment=GF_SECURITY_DISABLE_GRAVATAR=true
Environment=GF_SECURITY_COOKIE_SECURE=true
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_SNAPSHOTS_EXTERNAL_ENABLED=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false

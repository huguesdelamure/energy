# energy.mgmt0.net : clone d'energygraph.info (Grafana + ressources statiques)
<VirtualHost *:80>
    ServerName energy.mgmt0.net
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://energy.mgmt0.net%{REQUEST_URI} [END,QSA,R=permanent]
</VirtualHost>

<IfFile /etc/letsencrypt/live/energy.mgmt0.net/fullchain.pem>
<VirtualHost *:443>
    ServerName energy.mgmt0.net

    # Ressources des cartes (rasters de facteur de charge, contours de pays, palette, éoliennes)
    Alias /static/ /srv/energy/static/
    <Directory /srv/energy/static>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=86400"
    </Directory>
    ProxyPass /static/ !

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    SSLCertificateFile /etc/letsencrypt/live/energy.mgmt0.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/energy.mgmt0.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorLog ${APACHE_LOG_DIR}/energy-error.log
    CustomLog ${APACHE_LOG_DIR}/energy-access.log combined
</VirtualHost>
</IfFile>

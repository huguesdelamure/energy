# grafana.mgmt0.net : ancien nom, redirigé vers energy.mgmt0.net (2026-11-17)
<VirtualHost *:80>
    ServerName grafana.mgmt0.net
    Redirect permanent / https://energy.mgmt0.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName grafana.mgmt0.net
    Redirect permanent / https://energy.mgmt0.net/
    SSLCertificateFile /etc/letsencrypt/live/grafana.mgmt0.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/grafana.mgmt0.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
